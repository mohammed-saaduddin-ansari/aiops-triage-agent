apiVersion: v1
kind: ConfigMap
metadata:
  name: triage-agent
  namespace: triage
data:
  TRIAGE_LLM_PROVIDER: fake
  TRIAGE_LLM_MODEL: claude-opus-5-5
  TRIAGE_LLM_EFFORT: medium
  TRIAGE_KUBERNETES_MODE: auto
  TRIAGE_PROMETHEUS_URL: http://kps-prometheus.monitoring.svc:9090
  TRIAGE_LOKI_URL: http://loki.monitoring.svc:3100
  TRIAGE_DEBOUNCE_SECONDS: "15"
  TRIAGE_MAX_STEPS: "8"
  TRIAGE_TOKEN_BUDGET: "120000"
