# Read-only access for the triage agent. Deliberately excluded:
#   - every write verb (create, update, patch, delete, deletecollection)
#   - secrets and configmaps (credentials live there)
#   - pods/log and pods/exec (logs come from Loki, already redacted on the way in)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: triage-agent
  namespace: triage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: triage-agent-read
rules:
  - apiGroups: [""]
    resources: [pods, events, nodes, namespaces, services, endpoints]
    verbs: [get, list, watch]
  - apiGroups: ["events.k8s.io"]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: triage-agent-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: triage-agent-read
subjects:
  - kind: ServiceAccount
    name: triage-agent
    namespace: triage
