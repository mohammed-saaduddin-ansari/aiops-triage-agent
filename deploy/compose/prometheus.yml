global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: demo-app
    static_configs:
      - targets: ["demo-app:8081"]
        labels: {namespace: demo, app: demo-app}
  - job_name: triage-agent
    metrics_path: /metrics/
    static_configs:
      - targets: ["triage-agent:8080"]
