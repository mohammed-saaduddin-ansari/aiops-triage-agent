groups:
  - name: demo-app
    rules:
      - alert: HighErrorRate
        expr: |
          sum by (namespace, app) (rate(http_requests_total{code=~"5.."}[1m]))
            / sum by (namespace, app) (rate(http_requests_total[1m])) > 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.app }} 5xx ratio above 5% for 1m"
      - alert: HighLatencyP99
        expr: |
          histogram_quantile(0.99, sum by (namespace, app, le) (rate(http_request_duration_seconds_bucket[1m]))) > 0.75
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.app }} p99 latency above 750ms"
