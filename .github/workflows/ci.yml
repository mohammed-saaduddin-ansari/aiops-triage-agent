name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, tests, offline eval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          enable-cache: true

      - name: Install Python 3.12 and dependencies
        run: |
          uv python install 3.12
          uv sync --frozen

      - name: Lint
        run: make lint

      - name: Type-check
        run: make typecheck

      - name: Tests
        run: make test

      - name: Offline eval (FakeLLM, no API key)
        run: make eval

      - name: Publish eval report
        if: always()
        run: cat evals/reports/offline.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: evals/reports/offline.md

  docker:
    name: container image builds and runs the demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t aiops-triage-agent:ci .
      - name: Offline demo inside the image
        run: docker run --rm aiops-triage-agent:ci demo --scenario alert-storm-crashloop
