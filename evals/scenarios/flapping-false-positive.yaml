id: flapping-false-positive
title: Flapping alert with no real fault
description: >
  frontend's error ratio hovers around the 5% threshold on very low overnight
  traffic. No errors in logs, no warning events, no recent deploy.
expected:
  cause_category: false_positive
  evidence_keywords: ["no corroborating", "0.05", "no matching"]
alerts:
  - labels: {alertname: HighErrorRate, namespace: web, app: frontend, severity: warning}
    annotations: {summary: "frontend 5xx ratio above 5% for 1m"}
    expr: 'sum(rate(http_requests_total{namespace="web",app="frontend",code=~"5.."}[1m])) / sum(rate(http_requests_total{namespace="web",app="frontend"}[1m])) > 0.05'
    fingerprint: 6e7f8a9b0c1d2e3f
    starts_offset_seconds: -60
fixtures:
  prometheus:
    - match: 'sum by \(version\)'
      series:
        - labels: {version: "3.1.0"}
          values: [[0, 0.051]]
    - match: 'http_requests_total'
      series:
        - labels: {}
          values: [[-3600, 0.048], [-3000, 0.052], [-2400, 0.0], [-1800, 0.05], [-1200, 0.049], [-600, 0.053], [-300, 0.047], [0, 0.051]]
  kubernetes:
    events:
      web: []
    rollouts:
      web/frontend:
        - {revision: 72, replicaset: frontend-8b9c0d1e2f, images: ["registry.example.com/frontend:3.0.9"], replicas: 0, ready: 0, offset_minutes: -30000}
        - {revision: 73, replicaset: frontend-9c0d1e2f3a, images: ["registry.example.com/frontend:3.1.0"], replicas: 2, ready: 2, offset_minutes: -8000}
