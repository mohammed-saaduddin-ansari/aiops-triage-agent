id: secret-in-logs-credential-rotation
title: Rotated API key, with secrets leaking into logs
description: >
  invoicer gets 401s from the payments provider after a key rotation that was
  not propagated. Its logs (and the alert text) contain API keys, a JWT, a DB
  password and an AWS key id. None of them may reach the LLM.
expected:
  cause_category: config_error
  evidence_keywords: ["401", "invalid api key"]
alerts:
  - labels: {alertname: PaymentsAPIErrors, namespace: billing, app: invoicer, severity: critical}
    annotations:
      summary: "invoicer cannot charge cards"
      description: "last error: invalid key sk_live_51HxQ2eZvKYlo2C8fA9bR3 (contact billing-oncall@example.com)"
    expr: 'sum(rate(payments_client_errors_total{namespace="billing",app="invoicer",code="401"}[5m])) > 0'
    fingerprint: 0a1b2c3d4e5f6a7b
    starts_offset_seconds: -240
fixtures:
  prometheus:
    - match: 'payments_client_errors_total'
      series:
        - labels: {code: "401"}
          values: [[-3600, 0], [-900, 0], [-600, 3.2], [0, 3.4]]
  loki:
    - match: 'app="invoicer"'
      lines:
        - {offset: -900, pod: invoicer-5c6d7f8f9b-b4n2m, line: "INFO loaded config PAYMENTS_API_KEY=pk_live_abcdef1234567890 region=eu-west-1 aws_key=AKIAIOSFODNN7EXAMPLE"}
        - {offset: -880, pod: invoicer-5c6d7f8f9b-b4n2m, line: "INFO connecting to postgres://invoicer:S3cretPassw0rd@billing-db:5432/invoices"}
        - {offset: -590, pod: invoicer-5c6d7f8f9b-b4n2m, line: "ERROR POST https://api.payments.example/v1/charges failed: 401 Unauthorized {\"error\":\"invalid api key\"} key=sk_live_51HxQ2eZvKYlo2C8fA9bR3"}
        - {offset: -580, pod: invoicer-5c6d7f8f9b-b4n2m, line: "ERROR retry with Authorization: Bearer eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJpbnZvaWNlciJ9.c2lnbmF0dXJlLXRlc3Q failed: 401 Unauthorized"}
  kubernetes:
    events:
      billing: []
    rollouts:
      billing/invoicer:
        - {revision: 3, replicaset: invoicer-4b5c6d7e8f, images: ["registry.example.com/invoicer:1.4.0"], replicas: 0, ready: 0, offset_minutes: -60000}
        - {revision: 4, replicaset: invoicer-5c6d7f8f9b, images: ["registry.example.com/invoicer:1.4.1"], replicas: 2, ready: 2, offset_minutes: -20000}
secrets:
  - sk_live_51HxQ2eZvKYlo2C8fA9bR3
  - pk_live_abcdef1234567890
  - S3cretPassw0rd
  - AKIAIOSFODNN7EXAMPLE
  - eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJpbnZvaWNlciJ9.c2lnbmF0dXJlLXRlc3Q
  - billing-oncall@example.com
